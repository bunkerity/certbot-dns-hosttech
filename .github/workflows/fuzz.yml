name: Offline fuzzing

on:
  workflow_call:
  schedule:
    - cron: "15 3 * * 6"

permissions: {}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [zones, credentials, api]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked development tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Fuzz untrusted inputs offline
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_LIMIT: ${{ github.event_name == 'schedule' && '300' || '60' }}
        run: |
          mkdir -p findings corpus
          python -m fuzz.fuzz_hosttech "$TARGET" corpus "fuzz/corpus/$TARGET" -max_total_time="$SECONDS_LIMIT" -max_len=4096 -timeout=10 -artifact_prefix=findings/
      - name: Retain failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-findings
          path: findings/
          if-no-files-found: ignore
