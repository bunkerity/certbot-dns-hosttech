[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-hosttech"
version = "0.1.0"
description = "Hosttech DNS authenticator plugin for Certbot"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Bunkerity"}]
keywords = ["certbot", "letsencrypt", "acme", "dns-01", "hosttech"]
dependencies = ["certbot>=5.9.0,<6", "requests>=2.31.0,<3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.entry-points."certbot.plugins"]
dns-hosttech = "certbot_dns_hosttech._internal.dns_hosttech:Authenticator"

[project.urls]
Homepage = "https://github.com/bunkerity/certbot-dns-hosttech"
Source = "https://github.com/bunkerity/certbot-dns-hosttech"
Issues = "https://github.com/bunkerity/certbot-dns-hosttech/issues"
Changelog = "https://github.com/bunkerity/certbot-dns-hosttech/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "black>=24", "ruff>=0.9", "mypy>=1.14", "types-requests", "build", "twine", "setuptools>=77"]

[tool.setuptools.packages.find]
include = ["certbot_dns_hosttech*"]

[tool.black]
line-length = 160
target-version = ["py311"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["certbot_dns_hosttech"]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["certbot_dns_hosttech._internal.dns_hosttech"]

[tool.coverage.report]
show_missing = true
fail_under = 100
