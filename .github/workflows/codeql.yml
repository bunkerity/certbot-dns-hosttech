name: CodeQL analysis

on:
  schedule:
    - cron: "30 1 * * 6"
  workflow_call:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          build-mode: none
          setup-python-dependencies: false
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          upload: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          upload-database: ${{ github.event_name != 'pull_request' }}
