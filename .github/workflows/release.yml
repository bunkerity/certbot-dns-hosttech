name: Release

permissions: read-all

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # tests.yml runs the Plumber gate itself; a second direct call would upload a duplicate plumber-report artifact.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check version and changelog
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match pyproject.toml version {version!r}")
          section = re.search(
              rf"^## {re.escape(tag)} - \d{{4}}/\d{{2}}/\d{{2}}\n(.*?)(?=^## |\Z)",
              Path("CHANGELOG.md").read_text(),
              re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(1).strip():
              raise SystemExit(f"Missing or empty CHANGELOG.md section for {tag}")
          changes = section.group(1).strip()
          Path("release-notes.md").write_text(f"## certbot-dns-hosttech {version}\n\n### Changes\n\n{changes}\n\n")
          prerelease = str(Version(version).is_prerelease).lower()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\ntag={tag}\nprerelease={prerelease}\n")
          PY
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Prepare release assets
        run: |
          (cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS)
          wheel=$(basename -- dist/*.whl)
          cat >> release-notes.md <<EOF
          ### Installation

          \`\`\`sh
          python -m pip install "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${wheel}"
          \`\`\`

          See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md) for credentials and usage.
          EOF
      - name: Attest distributions
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Export signed provenance
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE_PATH" provenance.sigstore.json
          jq -ce '.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json" and (.signatures | length > 0))' "$BUNDLE_PATH" > provenance.intoto.jsonl
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            release-notes.md
            provenance.intoto.jsonl
            provenance.sigstore.json
          if-no-files-found: error

  # Required reviewers on the release environment approve the attested build. Every publication job descends from here.
  gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Recheck release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" |
            jq -e '.name == "release" and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0 and all(.reviewers[]; .type == "User" and (.reviewer.login | IN("TheophileDiot", "fl0ppy-d1sk"))))' >/dev/null
      - name: Recheck signed tag target before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(printf '%s' "$TAG_REF" | jq -r '.object.type')" = tag
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" |
            jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha' >/dev/null

  release:
    needs: [build, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
      - name: Check distribution hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Upload draft GitHub Release
        id: github_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            provenance.intoto.jsonl
            provenance.sigstore.json
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github_release.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq .draft | grep -Fx false

  pypi:
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/certbot-dns-hosttech/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
      - name: Check distribution hashes
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          # The upload action runs twine over the whole directory, which rejects a non-distribution file.
          mv SHA256SUMS ..
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
